<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dakhla Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.5a3 3 0 010 5.5M18 14.3c1.8.8 3 2.6 3 4.7"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></symbol>
<symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.2A9 9 0 0121 12a13 13 0 01-3 3.8M6.5 7.5A13 13 0 003 12s3.5 6 9 6c1.2 0 2.3-.3 3.3-.7"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
<symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 10-2.3 5.7M20 5v5h-5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol>
</defs></svg>
<div class="wrap">
<header>
 <div class="brand"><span class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4l3-5M17 5l3 5h-3M9 4l3-2 3 2M4 12l3-5 3 1M20 14l-3 5-3-1"/></svg></span>Dakhla Review</div>
 <div class="lang" role="group" aria-label="Language"><button data-l="fr">FR</button><button data-l="en">EN</button><button data-l="ar">العربية</button></div>
</header>

<div class="hero">
 <div>
  <h1 data-k="h1"></h1>
  <p data-k="sub"></p>
  <a class="btn" href="#download"><svg class="i" aria-hidden="true"><use href="#i-dl"/></svg><span data-k="cta"></span></a>
  <div class="badges" data-k="badge"></div>
 </div>
 <div class="phone" aria-hidden="true">
  <div class="ph-h"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M7 19H4l3-5M17 5l3 5h-3M9 4l3-2 3 2M4 12l3-5 3 1M20 14l-3 5-3-1"/></svg></span><span data-k="ph1"></span></div>
  <div class="grid2">
   <div class="pt a"><span class="ic"><svg class="i"><use href="#i-doc"/></svg></span><span data-k="ph2"></span></div>
   <div class="pt b"><span class="ic"><svg class="i"><use href="#i-share"/></svg></span><span data-k="ph3"></span></div>
   <div class="pt w"><span class="ic"><svg class="i"><use href="#i-list"/></svg></span><span data-k="ph4"></span></div>
   <div class="pt c"><span class="ic"><svg class="i"><use href="#i-camera"/></svg></span><span data-k="ph5"></span></div>
   <div class="pt b"><span class="ic"><svg class="i"><use href="#i-pin"/></svg></span><span data-k="ph6"></span></div>
   <div class="pt a"><span class="ic"><svg class="i"><use href="#i-users"/></svg></span><span data-k="ph7"></span></div>
  </div>
 </div>
</div>

<section>
 <h2 data-k="what_h"></h2>
 <p class="lead" data-k="what_p"></p>
</section>

<section>
 <h2 data-k="how_h"></h2>
 <div class="steps" style="margin-top:28px">
  <div class="step"><div class="n">1</div><h3 data-k="s1h"></h3><p data-k="s1p"></p></div>
  <div class="step"><div class="n">2</div><h3 data-k="s2h"></h3><p data-k="s2p"></p></div>
  <div class="step"><div class="n">3</div><h3 data-k="s3h"></h3><p data-k="s3p"></p></div>
 </div>
 <div class="chips" id="types"></div>
</section>

<section>
 <div class="track">
  <h2 data-k="tr_h"></h2>
  <p class="lead" data-k="tr_p"></p>
  <div class="stages" id="stages" role="tablist"></div>
  <div class="note" data-k="tr_n"></div>
 </div>
</section>

<section>
 <h2 data-k="pv_h"></h2>
 <div class="priv" id="priv" style="margin-top:26px"></div>
 <div class="limit" data-k="limit"></div>
</section>

<section id="download" style="padding-top:20px">
 <div class="cta">
  <div class="dlbox"><svg class="i" aria-hidden="true"><use href="#i-phone"/></svg></div>
  <h2 data-k="dl_h"></h2>
  <p data-k="dl_p"></p>
  <p style="margin:22px 0"><a class="btn" href="#" id="dl-link"><svg class="i" aria-hidden="true"><use href="#i-dl"/></svg><span data-k="dl_b"></span></a></p>
  <p data-k="lng"></p>
  <p><a class="mail" href="mailto:contact@example.com"><svg class="i" aria-hidden="true"><use href="#i-mail"/></svg>contact@example.com</a></p>
 </div>
</section>
<footer>Dakhla Review</footer>
</div>

<script src="script.js"></script>
</body>
</html>
